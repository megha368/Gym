# CI: runs on every push (any branch) and every pull request.
#   1. test:        for each service: install, lint, unit tests with coverage (fails under
#                   70%), and build its Docker image (a failed build fails the run)
#   2. integration: starts the whole system with docker compose and tests flows across
#                   the seam, including with Scheduling stopped
#   3. deploy:      only on a push to main, and only if 1 and 2 passed on this commit:
#                   push the images to GHCR, deploy them to Azure Container Apps, check
#                   /health, then deploy the UI to Azure Static Web Apps
#
# No secret is needed for CI: the tests' SQL Server is a throwaway container whose
# password is generated randomly for each run. CI never touches Azure SQL.

name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

# Your Azure names. Not secret: they're in system.yaml and the README too.
env:
  PREFIX: CHANGE-ME              # your IE username with dots replaced by hyphens, e.g. jsmith-ieu2023
  RESOURCE_GROUP: CHANGE-ME      # your class's resource group: rg-sdd-3a or rg-sdd-3b

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one service failing doesn't cancel the other's run
      matrix:
        service: [scheduling, bookings]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start a throwaway SQL Server for the tests
        run: |
          SA_PASSWORD="Ci_$(openssl rand -hex 12)_Aa1"
          echo "::add-mask::$SA_PASSWORD"
          echo "TEST_DATABASE_URL=mssql://sa:${SA_PASSWORD}@localhost:1433/${{ matrix.service }}_test" >> "$GITHUB_ENV"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" \
                 -Q "SELECT 1" -b -o /dev/null; then
              echo "SQL Server is ready"; exit 0
            fi
            sleep 2
          done
          docker logs mssql; exit 1

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests with coverage (fails below 70%)
        run: pytest --cov=${{ matrix.service }} --cov-report=term-missing --cov-fail-under=70

      - name: Build the Docker image
        run: docker build --build-arg VERSION=${{ github.sha }} -t ${{ matrix.service }}:${{ github.sha }} .

  integration:
    name: Integration test (docker compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway passwords
        run: |
          gen() { echo "Ci_$(openssl rand -hex 12)_Aa1"; }
          {
            echo "MSSQL_SA_PASSWORD=$(gen)"
            echo "SCHEDULING_DB_PASSWORD=$(gen)"
            echo "BOOKINGS_DB_PASSWORD=$(gen)"
            echo "BOOKINGS_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Start the whole system
        run: docker compose up -d --build

      - name: Wait until both services are healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fs localhost:8001/health && curl -fs localhost:8000/health; then exit 0; fi
            sleep 3
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install -r tests/integration/requirements.txt

      - name: Cross-seam tests (both services running)
        run: pytest tests/integration

      - name: Partial failure tests (Scheduling stopped)
        run: |
          docker compose stop scheduling
          EXPECT_SCHEDULING_DOWN=1 pytest tests/integration

      - name: Show the containers' logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Azure
    needs: [test, integration]   # only runs if CI passed on this same commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # to push images to GitHub Container Registry
    concurrency:                 # never two deploys at the same time
      group: deploy-azure
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$OWNER" >> "$GITHUB_ENV"
          echo "REGISTRY_USER=$OWNER" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images, tagged with the commit SHA
        run: |
          for service in scheduling bookings; do
            image="$REGISTRY/gym-$service"
            docker build --build-arg VERSION="$IMAGE_TAG" -t "$image:$IMAGE_TAG" -t "$image:latest" "services/$service"
            docker push "$image:$IMAGE_TAG"
            docker push "$image:latest"
          done

      - name: Sign in to Azure (class service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Find the UI's address (the only origin allowed by CORS)
        run: |
          host=$(az staticwebapp show --name "$PREFIX-ui" --resource-group "$RESOURCE_GROUP" --query defaultHostname --output tsv)
          echo "UI_ORIGIN=https://$host" >> "$GITHUB_ENV"

      - name: Deploy the scheduling service
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DATABASE_URL: ${{ secrets.SCHEDULING_DATABASE_URL }}
        run: |
          fqdn=$(deploy/deploy-containerapp.sh "$PREFIX-scheduling" "$REGISTRY/gym-scheduling:$IMAGE_TAG" \
            "database-url=$DATABASE_URL" \
            -- \
            "DATABASE_URL=secretref:database-url" "UI_ORIGIN=$UI_ORIGIN" "SEED_DEMO_DATA=1" | tail -n 1)
          echo "SCHEDULING_URL=https://$fqdn" >> "$GITHUB_ENV"

      - name: Deploy the bookings service
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DATABASE_URL: ${{ secrets.BOOKINGS_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.BOOKINGS_SECRET_KEY }}
        run: |
          # SCHEDULING_TIMEOUT_S is longer than locally (2 s): on Azure, Scheduling may be
          # scaled to zero and need several seconds to start (see ADR-8)
          fqdn=$(deploy/deploy-containerapp.sh "$PREFIX-bookings" "$REGISTRY/gym-bookings:$IMAGE_TAG" \
            "database-url=$DATABASE_URL" "secret-key=$SECRET_KEY" \
            -- \
            "DATABASE_URL=secretref:database-url" "SECRET_KEY=secretref:secret-key" \
            "SCHEDULING_URL=$SCHEDULING_URL" "SCHEDULING_TIMEOUT_S=10" "UI_ORIGIN=$UI_ORIGIN" | tail -n 1)
          echo "BOOKINGS_URL=https://$fqdn" >> "$GITHUB_ENV"

      - name: Check /health on both services (fails the run if not healthy within 5 minutes)
        run: |
          # Up to 30 tries, 10 s apart: the first request may have to start the container
          # and wake the paused database, which takes up to about a minute.
          # Healthy means status "ok" AND running this commit's version (not the old one).
          check() {
            for attempt in $(seq 1 30); do
              body=$(curl -s --max-time 90 "$1/health" || true)
              if echo "$body" | jq -e --arg v "$IMAGE_TAG" '.status == "ok" and .version == $v' > /dev/null 2>&1; then
                echo "$1 is healthy and running $IMAGE_TAG"; return 0
              fi
              echo "Waiting for $1 (attempt $attempt): $body"; sleep 10
            done
            echo "::error::$1 did not become healthy"; return 1
          }
          check "$SCHEDULING_URL"
          check "$BOOKINGS_URL"

      - name: Point the UI at the deployed services
        run: |
          cat > ui/config.js <<EOF
          // Written by the deploy job: where the services are on Azure
          window.APP_CONFIG = {
            SCHEDULING_URL: "$SCHEDULING_URL",
            BOOKINGS_URL: "$BOOKINGS_URL",
          };
          EOF
          cat ui/config.js

      - name: Deploy the UI to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: ui
          output_location: ""
          skip_app_build: true

      - name: Summary
        run: |
          {
            echo "### Deployed $IMAGE_TAG"
            echo "- UI: $UI_ORIGIN"
            echo "- Scheduling: $SCHEDULING_URL/health"
            echo "- Bookings: $BOOKINGS_URL/health"
          } >> "$GITHUB_STEP_SUMMARY"
